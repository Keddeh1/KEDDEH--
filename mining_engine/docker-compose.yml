version: '3.8'
services:
  stratum-engine-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stratum_production_runtime
    ports:
      - "8080:8080"
    environment:
      - STRATUM_HOST=bitcoin.viabtc.io
      - STRATUM_PORT=3333
      - STRATUM_WORKER=keddeh.001
      - HTTP_PORT=8080
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
