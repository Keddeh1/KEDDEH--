name: Engineering Layer Qualification

on:
  push:
    paths:
      - 'runtime/engineering/**'
      - 'runtime/braink_family.py'
      - 'runtime/web4_admission.py'
      - 'runtime/component-sources.json'
      - 'tests/engineering-layer.test.mjs'
      - 'mcp/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'opt/keddeh/**'
      - '.github/workflows/engineering-layer-qualification.yml'
  workflow_dispatch:

jobs:
  braink-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Web4 binary admission contract
        run: python3 tests/web4-admission.test.py
      - name: Resident BRAINK family integration and failure recovery
        run: python3 scripts/bootstrap-braink-runtime.py

  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check engineering runtime
        run: |
          node --check runtime/engineering/common.mjs
          node --check runtime/engineering/tot-safety-kernel.mjs
          node --check runtime/engineering/distributed-coordinate-directory.mjs
          node --check runtime/engineering/layer2-reconciler.mjs
          node --check runtime/engineering/index.mjs
          node --check mcp/server.mjs
      - name: Fault injection tests
        run: node --test tests/engineering-layer.test.mjs
      - name: MCP runtime self-test
        run: node mcp/server.mjs --self-test
      - name: MCP modern discovery and tool call smoke
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{},"_meta":{"protocolVersion":"2026-07-28"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"polarity_assess","arguments":{"positive":3,"negative":-3}},"_meta":{"protocolVersion":"2026-07-28"}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"coordinate_register","arguments":{"address":"0","state":"READY","revisionId":"R1","authority":"USER_OPERATOR","evidence":["fault"]}},"_meta":{"protocolVersion":"2026-07-28"}}' \
            | node mcp/server.mjs | tee /tmp/mcp-smoke.jsonl
          grep -q '"assessment":0' /tmp/mcp-smoke.jsonl
          grep -q 'ZERO_NOT_PERMITTED_AS_ADDRESS' /tmp/mcp-smoke.jsonl

  workstation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Frozen dependency installation
        run: npm ci
      - name: Core runtime and carrier installation tests
        run: |
          npm run test:core
          npm run test:installation
      - name: Workstation type and build checks
        run: |
          npm run lint
          npm run build
      - name: Native layout compilation and readback
        run: |
          make -C opt/keddeh
          opt/keddeh/bin/keddeh_mesh_runtime --layout-check
