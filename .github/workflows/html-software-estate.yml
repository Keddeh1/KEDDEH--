name: HTML Software Estate Qualification

on:
  push:
    paths:
      - 'software-estate/**'
      - '.github/workflows/html-software-estate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: software-estate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Locate isolated test browser
        run: node -e "console.log('CHROMIUM_PATH='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run test:integrity
      - run: npm run test:static
      - run: npm run test:r14
      - run: npm run test:csv
      - run: npm run test:browser
      - run: npm run test:families
      - run: npm run test:hcf
      - run: npm run docs:validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-html-evidence
          path: |
            software-estate/evidence/**/*.json
            software-estate/docs/validation.json
