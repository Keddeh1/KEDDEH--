syntax = "proto3";

package keddeh.systems.triad.v1;

enum MatrixStatus {
  MATRIX_STATUS_UNSPECIFIED = 0;
  MATRIX_STATUS_PENDING = 1;
  MATRIX_STATUS_VERIFIED_OPERATIONAL = 2;
  MATRIX_STATUS_FALSIFIED_FAULT = 3;
}

message ConceptTier {
  string word_processed = 1;
  string assigned_node_id = 2;
  string vfs_mount_path = 3;
}

message ExecutionTier {
  string il_llm_state = 1;
  string braink_verdict = 2;
  optional uint64 kex_memory_allocation_offset = 3;
}

message ResearchProvenance {
  string source_git_revision = 1;
  optional double empirical_saturation_ratio = 2;
}

message IntegrationTier {
  bool sdk_commit_verified = 1;
  string mcp_transport_version = 2;
  ResearchProvenance provenance = 3;
}

message TriadMatrixHopRequest {
  string raw_word_input = 1;
  string target_git_revision = 2;
  double current_load_factor = 3;
  string authority_signature = 4;
  string request_id = 5;
  string authority_key_id = 6;
}

message TriadMatrixHopResponse {
  MatrixStatus status = 1;
  ConceptTier concept = 2;
  ExecutionTier execution = 3;
  IntegrationTier integration = 4;
  string authority_lock = 5;
  int64 timestamp_epoch_ns = 6;
  string request_id = 7;
  repeated string receipt_digests = 8;
  uint32 readiness_mask = 9;
  CalibrationMetrics measured_metrics = 10;
  RegistrarConstraint registrar_constraint = 11;
  string vfs_receipt_digest = 12;
  string vfs_artifact_digest = 13;
  double declared_load_factor = 14;
}

// Measurements describe the named local carrier; they are not WAN guarantees.
message CalibrationMetrics {
  uint32 sample_count = 1;
  optional double measured_p99_latency_ms = 2;
  double thread_pool_saturation = 3;
  optional double disk_busy_fraction = 4;
  optional double tolerance_index = 5;
  string measurement_scope = 6;
  bool calibrated = 7;
  bool latency_sla_met = 8;
  string policy_version = 9;
  optional double p99_latency_ema_ms = 10;
}

message RegistrarConstraint {
  bool verified = 1;
  string status = 2;
  bool affects_braink_admission = 3;
}

service TriadMeshOrchestrator {
  rpc Readiness(TriadReadinessRequest) returns (TriadReadinessResponse);
  rpc TraversalMatrixHop(TriadMatrixHopRequest) returns (TriadMatrixHopResponse);
  rpc StreamMatrixTelemetry(TriadMatrixHopRequest) returns (stream TriadMatrixHopResponse);
}

message TriadReadinessRequest {}
message TriadReadinessResponse {
  uint32 readiness_mask = 1;
  string node_identity = 2;
  string source_git_revision = 3;
  bool ledger_integrity = 4;
}
